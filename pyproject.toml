[project]
name = "model-components"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tarun Krisha", email = "krishnatarun7@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "datasets>=5.0.1",
    "numpy<2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "transformers",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src*"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
